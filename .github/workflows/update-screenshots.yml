name: update-screenshots

# Makes the Chromium baselines for the Storybook screenshot suite on the same
# runner image that checks them (H19, R37). Run it from the Actions tab on the
# branch whose stories or styles changed on purpose, download the artifact, and
# commit its files to `apps/docs/e2e/__screenshots__/`. Nothing is pushed from here.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter docs exec playwright install --with-deps chromium
      - run: pnpm --filter docs build-storybook
      - name: Make the baselines
        run: pnpm --filter docs test:screenshots:update
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: apps/docs/e2e/__screenshots__/
          if-no-files-found: error

name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A PR whose files are all docs or Markdown only needs lint and Prettier (R46). Everything
  # else, and every push to main, runs the full pipeline.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Does this change touch more than docs?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qvE '^docs/|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Docs and Markdown only: running lint and Prettier."
          fi

  # Docs-only path. `pnpm check` runs lint as its first step, so the full jobs cover it.
  lint:
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      # With the browsers cached this only installs the system packages.
      - name: Install Playwright browsers
        run: pnpm --filter site exec playwright install --with-deps chromium firefox webkit
      - run: pnpm check
      # Coverage is reported on the run summary and never fails the job (H19).
      - name: Coverage report (not enforced)
        run: |
          pnpm --filter @puranderdua/ui test:coverage
          node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      # The build writes a tracked file into src/ (ds-classes.ts). If it changed,
      # the committed copy is stale (R14).
      - name: Build leaves the tree clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The build changed tracked or untracked files; commit the regenerated output:"
            git status --porcelain
            git diff
            exit 1
          fi
      - name: Shell scripts pass shellcheck
        run: shellcheck scripts/*.sh

  # Site smoke and accessibility tests against a local `next start`, in parallel with `check`.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Playwright browsers
        run: pnpm --filter site exec playwright install --with-deps chromium firefox webkit
      - name: Site smoke and accessibility tests (local next start)
        run: pnpm --filter site test:e2e

  # Packs the tarball into a fresh Next app (needs network), so it only runs when the package
  # or the script changes. Always runs on pushes to main.
  check-rsc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Does this change touch the package?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qE '^(packages/ui/|scripts/check-rsc\.sh$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No change under packages/ui/** or scripts/check-rsc.sh; skipping."
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - if: steps.changes.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.run == 'true'
        run: pnpm check:rsc

name: clean-install

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: scripts/clean-install.sh

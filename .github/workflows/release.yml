name: Release

# Publishes @puranderdua/ui when Purander pushes a tag `v<version>` and approves the
# `npm-publish` deployment. Trusted publishing (OIDC): there is no npm token.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag must equal the package version
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/check-release-tag.sh "$TAG" packages/ui/package.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          # No registry-url: it writes an .npmrc with `_authToken=${NODE_AUTH_TOKEN}`, and a
          # configured (empty) token can stop npm from using the OIDC trusted-publishing exchange.
          # npm publishes to registry.npmjs.org by default.
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter site exec playwright install --with-deps chromium firefox webkit
      - run: pnpm check
      - run: pnpm check:rsc
      # Trusted publishing needs npm >= 11.5.1.
      - name: Use a trusted-publishing capable npm
        run: npm install --global npm@^11.5.1
      - name: Publish with provenance
        working-directory: packages/ui
        run: npm publish --provenance --access public --loglevel verbose
